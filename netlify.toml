# Site Netlify : dashboard statique, API de lecture et d'envoi des agrégats, watchdog (SPEC.md §3,
# D21). La collecte et le traitement tournent sur le VPS. Route ou planification de chaque
# fonction : dans son fichier (`export const config`), cron en UTC.
# Rappel : aucun run de collecte ne doit déclencher de déploiement (SPEC.md §3.2).

[build]
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# En-têtes de sécurité du site (SPEC.md §17, lot S2). Scripts du seul site ; styles en ligne
# permis pour les infobulles d'ECharts ; images de la carte depuis les tuiles OpenStreetMap.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fichiers du build nommés d'après leur contenu : cache d'un an.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
