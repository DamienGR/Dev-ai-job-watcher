<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Veille emploi Dev &amp; IA</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --fg: #1d1d1b;
        --muted: #5f5f5a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151514;
          --fg: #ececea;
          --muted: #a3a39e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 36rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Veille emploi Dev &amp; IA</h1>
      <p>
        Tableau de bord du marché de l'emploi dev, data et IA en France, en
        préparation. Les premiers indicateurs seront publiés après la mise en
        service de la collecte hebdomadaire.
      </p>
    </main>
  </body>
</html>
