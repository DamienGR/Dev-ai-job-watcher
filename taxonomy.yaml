# =============================================================================
# Taxonomie — Veille emploi Dev & IA
# =============================================================================
# Ce fichier est la source de vérité de la classification des offres.
# Il est modifié chaque mois par la routine de revue (via pull request),
# jamais à la main sans incrémenter `version` ni compléter TAXONOMY_CHANGELOG.md.
#
# Conventions des motifs (voir SPEC.md §6.4 normalisation et §6.5 classification) :
# - Chaque motif est le source d'une RegExp JavaScript (sans délimiteurs),
#   compilée avec le seul drapeau "i".
# - Les motifs s'appliquent au texte NORMALISÉ : minuscules, accents retirés,
#   apostrophes typographiques remplacées par ', marqueurs de genre supprimés
#   ("(H/F)", "F/H/X", "·se", "(e)"...), espaces compactés.
#   → écrire "developpeur", "ingenieur", "donnees" (sans accents).
# - Les formes féminines pleines ne sont PAS ramenées au masculin : écrire les
#   deux formes (ex. 'developpeu(r|se)', 'ingenieure?', 'chef(·?fe)?',
#   'technicien(·?ne)?'). La normalisation ne retire le point médian que dans
#   "·e", "·es" et, après "eur", dans "·se", "·euse", "·rice", "·ice".
# - Pour une apostrophe, utiliser "." (ex. 'ingenieur d.affaires').
# - Les caractères + # . / - sont conservés par la normalisation.
# - Rôles : le motif `title.include` qui matche avec la `priority` la plus
#   haute gagne (rôle principal). Les autres rôles matchés sont conservés
#   comme rôles secondaires. Un `exclude` qui matche annule le rôle.
# - Ne jamais supprimer un rôle : passer `status: deprecated` pour conserver
#   l'historique. Les `id` sont stables et ne sont jamais renommés.
# =============================================================================

version: 3
updated: 2026-10-03

# -----------------------------------------------------------------------------
# Filet de collecte France Travail (codes ROME 4.0)
# -----------------------------------------------------------------------------
# core      : collectés systématiquement
# secondary : collectés systématiquement, fort taux de hors-périmètre attendu
# extended  : collectés pour reconnaître le « périmètre élargi » (g9), masqué
#             par défaut dans le dashboard
# Codes M18xx du ROME 4.0 vérifiés sur l'API le 2026-10-03 (M1801 à M1820) ;
# libellés et volumes dans TAXONOMY_CHANGELOG.md (v3).
rome_codes:
  core: [M1805, M1811, M1818]
  secondary: [M1806, M1802, M1803]
  extended: [M1801, M1810]

# -----------------------------------------------------------------------------
# Groupes de métiers
# -----------------------------------------------------------------------------
# status : socle | etabli | emergent | declin | hors_perimetre
# dashboard : affiché par défaut dans le dashboard
# keyword_pass : true → le groupe fait l'objet d'une collecte par mots-clés
#                sans filtre ROME (métiers émergents mal codés dans le ROME)
groups:
  - id: g1_dev
    label: Développement logiciel & web
    status: socle
    dashboard: true
    keyword_pass: false
  - id: g2_data
    label: Data
    status: socle
    dashboard: true
    keyword_pass: false
  - id: g3_ia_ml
    label: IA / ML « classique »
    status: etabli
    dashboard: true
    keyword_pass: true
  - id: g4_genai_agentique
    label: IA générative & agentique
    status: emergent
    dashboard: true
    keyword_pass: true
  - id: g5_deploiement
    label: Interface client / déploiement IA
    status: emergent
    dashboard: true
    keyword_pass: true
  - id: g6_pilotage
    label: Pilotage & transformation IA
    status: emergent
    dashboard: true
    keyword_pass: true
  - id: g7_gouvernance
    label: Gouvernance, conformité & sécurité IA
    status: emergent
    dashboard: true
    keyword_pass: true
  - id: g8_temoins
    label: Témoins de déclin
    status: declin
    dashboard: true
    keyword_pass: true
  - id: g9_elargi
    label: Périmètre élargi (infra, cyber, support, commercial)
    status: hors_perimetre
    dashboard: false
    keyword_pass: false

