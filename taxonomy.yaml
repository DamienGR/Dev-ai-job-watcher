# -----------------------------------------------------------------------------
# Types d'employeurs (ordre d'évaluation = ordre de la liste)
# -----------------------------------------------------------------------------
# naf_prefixes : comparés au code NAF de l'offre (France Travail, ex. "62.02A")
# name_patterns : comparés au nom d'employeur normalisé (toutes sources)
# Sans NAF ni nom reconnu : "inconnu" (pas "client_final").
employer_types:
  - id: recrutement_interim
    label: Cabinet de recrutement / intérim
    naf_prefixes: ['78.1', '78.2', '78.3']
    name_patterns:
      - '\b(adecco|randstad|manpower|hays|michael page|page personnel|robert half|robert walters|walters people|expectra|proman|synergie|start people|spring france|externatic|urban linker|hunteed|lincoln|fed it|silkhom|digirocks|free[ -]?work)\b'
  - id: esn_conseil
    label: ESN / conseil / ingénierie
    naf_prefixes: ['62.02', '62.03', '70.22', '71.12B']
    name_patterns:
      - '\b(capgemini|sopra|alten|akkodis|cgi|accenture|atos|eviden|inetum|talan|keyrus|devoteam|onepoint|wavestone|sii|expleo|ausy|aubay|extia|davidson|modis|altran|cognizant|infosys|tata consultancy|ibm|deloitte|kpmg|ernst ?& ?young|pwc|sfeir|octo technology|xebia|publicis sapient|magellan|umanis|apside|astek|groupe open|neurones|econocom|spie ics|scalian|segula|assystem|amaris|ekino|theodo|zenika|ippon)\b'
  - id: public_recherche
    label: Public / recherche / enseignement
    naf_prefixes: ['84.', '85.4', '72.1', '72.2']
    name_patterns:
      - '\b(cnrs|inria|cea|cnes|onera|inrae|inserm|ifremer|ign|insee|universite|ecole nationale|ecole polytechnique|centrale|ministere|prefecture|conseil (regional|departemental)|mairie|ville de|metropole|chu|ap-hp|france travail|urssaf|caf)\b'
  - id: editeur_logiciel
    label: Éditeur de logiciel / startup tech
    naf_prefixes: ['58.2', '62.01']
