    group: g1_dev
    label: Développeur web
    priority: 39
    title:
      include:
        - '\b(developpeu(r|se)|developer) web\b'
        - '\bweb developer\b'
        - '\bwebmaster\b'
        - '\b(developpeu(r|se)|developer) (php|symfony|laravel|javascript|typescript|node\.?js)\b'

  - id: dev_generic
    group: g1_dev
    label: Développeur (générique)
    priority: 10
    title:
      include:
        - '\b(developpeu(r|se)|developer|dev|programmeu(r|se))\b'
        - '\b(java|python|\.net|c#|c\+\+|golang|php|ruby|scala|kotlin) (developer|engineer)\b'

# -----------------------------------------------------------------------------
# Signaux (appliqués à la DESCRIPTION, sauf mention contraire)
# -----------------------------------------------------------------------------
# Attention : ne jamais utiliser '\bai\b' seul sur les descriptions
# (« j'ai » devient « j ai » ou « j'ai » après normalisation).
signals:
  genai:
    description: Mention d'IA générative, LLM, RAG ou agents
    patterns:
      - '\bllms?\b'
      - '\blarge language models?\b'
      - '\bgen ?ai\b'
      - '\bia generative\b'
      - '\bgenerative ai\b'
      - '\brag\b'
      - '\bretrieval[ -]augmented\b'
      - '\bagenti(c|que)s?\b'
      - '\bagents? (ia|autonomes?|intelligents?|conversationnels?)\b'
      - '\bai agents?\b'
      - '\bchat ?gpt\b'
      - '\bopenai\b'
      - '\banthropic\b'
      - '\bclaude (code|ai|api|sonnet|opus|haiku)\b'
      - '\bmistral( ai)?\b'
      - '\blangchain\b'
      - '\blanggraph\b'
      - '\bprompts?\b'
      - '\bcopilot\b'

  ai_any:
    description: Mention d'IA au sens large (hybridation des offres)
    extends: genai
    patterns:
      - '\bia\b'
      - '\bintelligence artificielle\b'
      - '\bartificial intelligence\b'
      - '\bmachine learning\b'
      - '\bdeep learning\b'
      - '\bapprentissage (automatique|profond)\b'
      - '\b(applied|generative|conversational|responsible) ai\b'
      - '\bai[ -](engineer|act|first|driven|powered|based|native|models?|solutions?|platform|products?|tools?|assisted|augmented)\b'
      - '\bnlp\b'
      - '\bcomputer vision\b'
      - '\bvision par ordinateur\b'

  remote:
    description: Mode de travail (ordre d'évaluation full_remote > hybrid > on_site)
    # L'ordre d'évaluation est fixé par SPEC.md §6.6 : les motifs full_remote et
    # hybrid ignorent donc les formes niées (« pas de », « pas en », « sans »,
    # « aucun ») et ne dépassent pas la phrase (la normalisation met tout le texte
    # sur une ligne : « . ; ! ? » servent de bornes).
    full_remote:
      - '(?<!(pas de|pas en|sans|aucun) )\bfull[ -]?remote\b'
      - '\bfully remote\b'
      - '\bremote[ -]first\b'
      - '(?<!(pas de|pas en|sans|aucun) )\b100 ?% (teletravail|remote|a distance)\b'
      - '(?<!(pas de|pas en|sans|aucun) )\bteletravail (complet|total|integral)\b'
      - '(?<!pas )\btotalement (en )?teletravail\b'
    hybrid:
      - '\bhybride?\b'
      - '(?<!(pas de|pas en|sans|aucun) )\bteletravail (partiel|possible|occasionnel|frequent|regulier)\b'
      - '\b\d ?(j|jours?) (de |en )?teletravail\b'
      - '(?<!(pas de|pas en|sans|aucun) )\bteletravail\b[^.;!?]{0,50}?\b\d ?(j|jours?)\b'
      - '\b[1-4] ?(j|jours?) (sur site|en presentiel)\b'
      - '\bhybrid\b'
    on_site:
      - '\b(pas de|pas en|sans|aucun) teletravail\b'
      - '\bteletravail ?: ?non\b'
      - '\bteletravail (non (possible|autorise)|impossible)\b'
      - '\b5 ?(j|jours?)( ?/ ?5| sur 5)? (sur site|en presentiel)\b(?! par mois)'
      - '\b100 ?% (presentiel|sur site)\b'
      - '\bfull (presentiel|on[ -]?site)\b'
      - '\bon[ -]?site only\b'

  tjm:
    description: Rémunération journalière (mission freelance / portage)
    patterns:
      - '\btjm\b'
      - '\btaux journalier\b'
      - '\b\d{3,4} ?(€|eur|euros?) ?(ht )?(/|par) ?(j|jour)\b'
      - '\bper day\b'
      - '\bdaily rate\b'

  travel:
    description: Déplacements mentionnés (structurant pour les FDE)
    patterns:
      - '\bdeplacements? (frequents?|reguliers?|ponctuels?|a prevoir|chez (le|les|nos) clients?|en clientele|en france|a l.etranger)\b'
      - '\btravel (required|up to|frequently|\d+ ?%)\b'
      - '\b\d+ ?% (de )?deplacements?\b'

